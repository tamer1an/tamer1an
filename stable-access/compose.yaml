# Stable address for this machine's local services, whatever its LAN/Wi-Fi IP is.
#
#   tailnet device ──WireGuard──▶ tailscale (node "bank", fixed 100.x IP + MagicDNS name)
#                                    │ serve.json: TCP 7077 / 11434 → 127.0.0.1 in this netns
#                                    ▼
#                                  proxy (Caddy, same netns) ── rewrites Host ──▶ host.docker.internal
#                                                                                 ├─ agent-bank :7077
#                                                                                 └─ Ollama     :11434
#
# Nothing is published on the host's LAN interface and no router port is opened.
name: stable-access

services:
  tailscale:
    image: tailscale/tailscale:v1.84.0
    hostname: ${TS_HOSTNAME:-bank}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}            # only needed for the first login; state persists in ts-state
      TS_HOSTNAME: ${TS_HOSTNAME:-bank}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"                   # no /dev/net/tun or NET_ADMIN needed
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway    # Docker Desktop already provides it; this keeps plain Engine working too
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  proxy:
    image: caddy:2.10.0-alpine
    network_mode: service:tailscale          # listens on the tailscale container's loopback only
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      BANK_PORT: ${BANK_PORT:-7077}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]              # the caddy binary carries this file capability; exec fails without it
    restart: unless-stopped

volumes:
  ts-state:
